name: Release

# Tag-driven, not commit-driven. A push to main should not publish anything:
# releasing is a decision, and `git tag v0.2.0` is where that decision is
# recorded. semantic-release's automatic mode would make every merge a
# potential publish, which is the wrong default for a framework other people
# pin.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # Trusted publishing to PyPI: no long-lived token in repository secrets.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --locked

      # The tag and the packaged version must agree, or `pip install
      # vision-use==0.2.0` installs something that calls itself 0.1.0. Checked
      # before anything is built, so a mismatch costs seconds rather than a
      # yanked release.
      - name: Check the tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(uv run vision version)"
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag $tag does not match project version $packaged"
            exit 1
          fi

      - name: Run the gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -m "not asr"

  pypi:
    name: publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the distribution
        run: uv build

      # An sdist that cannot be installed is only discovered by whoever tries
      # first. Better here.
      - name: Check the metadata
        run: uvx twine check dist/*

      - name: Publish
        run: uv publish --trusted-publishing always

  image:
    name: publish the image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notes:
    name: release notes
    needs: [pypi, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generated from the commits since the last tag. Conventional Commits
      # make this readable rather than a list of "fix stuff"; CONTRIBUTING.md
      # asks for them for exactly this reason.
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
